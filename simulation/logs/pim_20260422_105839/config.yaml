datarate: 26480        # データレート [Hz] 26.48kbps
tu: 0.3776435045e-04     # タイムユニット [s] (デフォルト: 1/datarate) 検証用2.358490566e-06 
max_tags: 100            # 生成する総タグ数
nodes: [1, 5, 10, 15, 20, 25, 30]          # 総タグ数からランダム選択するタグ数リスト
data_bits: 8            # データビット数
id_bits: 8              # ID長
backoff_max: 4096       # ランダムバックオフ最大値 [TU]
delimiter_bits: 8       # デリミタ長 [bit]
data_tu_mult: 1         # データ待機単位時間のTU倍数
num_rounds: 100         # ラウンド数
