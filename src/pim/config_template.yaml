datarate: 212000        # データレート [Hz]
tu: 2.358490566e-06     # タイムユニット [s] 
max_tags: 100            # 生成する総タグ数
nodes: [5, 10]          # 総タグ数からランダム選択するタグ数リスト
data_bits: 8            # データビット数
id_bits: 8              # ID長
backoff_max: 4096       # ランダムバックオフ最大値 [TU]
delimiter_bits: 8       # デリミタ長 [bit]
data_tu_mult: 1         # データ待機単位時間のTU倍数
num_rounds: 10000         # ラウンド数
random_seed: 42         # 乱数シード
